name: neuronet_core
description: Shared models, services, theme, and widgets for NEURONET apps.
version: 0.1.0
publish_to: none

resolution: workspace

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Models & Serialization
  freezed_annotation: ^3.1.0
  faker: ^2.1.0
  json_annotation: ^4.11.0

  # Networking
  dio: ^5.7.0

  # Routing (shared route definitions)
  go_router: ^14.8.1

  # Local Storage
  shared_preferences: ^2.3.4
  flutter_secure_storage: ^9.2.4

  # Notifications
  firebase_messaging: ^15.1.7
  flutter_local_notifications: ^18.0.1

  # UI
  cached_network_image: ^3.4.1
  fl_chart: ^1.2.0
  intl: ^0.20.2
  flutter_animate: ^4.5.2
  rive: ^0.13.15
  google_fonts: ^6.2.1
  animations: ^2.0.11

  # Utilities
  equatable: ^2.0.7
  logger: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: any
  freezed: ^3.2.4
  json_serializable: ^6.11.3
  riverpod_generator: ^4.0.3
  mocktail: ^1.0.4


flutter:
