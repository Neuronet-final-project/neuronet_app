name: adolescent_app
description: NEURONET Adolescent Mobile App
publish_to: none
version: 0.1.0

resolution: workspace

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # Shared Core
  neuronet_core:
    path: ../../packages/neuronet_core

  # State Management
  flutter_riverpod: ^3.3.1
  device_preview: ^1.3.1
  riverpod_annotation: ^4.0.2

  # Routing
  go_router: ^14.8.1

  # Models & Serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0

  # UI
  cached_network_image: ^3.4.1

  # Utilities
  intl: ^0.20.2
  flutter_dotenv: ^5.2.1
  flutter_markdown: ^0.7.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: any
  freezed: ^3.2.4
  json_serializable: ^6.11.3
  riverpod_generator: ^4.0.3
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "../../assets/adolescent_app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
