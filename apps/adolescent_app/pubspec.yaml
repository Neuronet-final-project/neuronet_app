name: adolescent_app
description: NEURONET Adolescent Mobile App
publish_to: none
version: 0.1.0

resolution: workspace

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # Shared Core
  neuronet_core:
    path: ../../packages/neuronet_core

  # State Management
  flutter_riverpod: ^3.2.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.8.1

  # Models & Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.11.0

  # UI
  cached_network_image: ^3.4.1

  # Utilities
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.9
  freezed: ^2.5.7
  json_serializable: ^6.11.0
  riverpod_generator: ^3.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
